<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.6; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(10px); }
    }
    @keyframes dashCycle {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes nodePulse {
      0%, 100% { r: 5; fill-opacity: 0.7; }
      50% { r: 8; fill-opacity: 1; }
    }
    .orb1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb2 { animation: pulseOrb 10s ease-in-out infinite alternate; transform-origin: 1000px 320px; }
    .card-float-1 { animation: floatCard1 6s ease-in-out infinite; }
    .card-float-2 { animation: floatCard2 7s ease-in-out infinite; }
    .pulse-data-line { stroke-dasharray: 8 6; animation: dashCycle 20s linear infinite; }
    .node-anim-1 { animation: nodePulse 3s ease-in-out infinite; }
    .node-anim-2 { animation: nodePulse 4s ease-in-out infinite 1s; }
    .node-anim-3 { animation: nodePulse 3.5s ease-in-out infinite 2s; }
  </style>

  <!-- Background -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)" />

  <!-- Animated Glowing Atmosphere Orbs (Background layer) -->
  <circle class="orb1" cx="220" cy="110" r="140" fill="#38bdf8" filter="url(#glow)" />
  <circle class="orb2" cx="980" cy="310" r="160" fill="#a855f7" filter="url(#glow)" />
  <circle cx="600" cy="210" r="100" fill="#6366f1" filter="url(#glow)" opacity="0.15" />

  <!-- Architectural Background Grid -->
  <g stroke="#334155" stroke-width="0.75" stroke-opacity="0.35">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Dynamic Schema Flow Diagrams (Sides & Background - Kept away from text) -->
  <g class="card-float-1" opacity="0.6">
    <!-- Left Entity Card -->
    <rect x="50" y="240" width="170" height="130" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" />
    <rect x="50" y="240" width="170" height="28" rx="10" fill="#0284c7" fill-opacity="0.25" />
    <text x="65" y="259" fill="#38bdf8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="bold" font-size="12">⚙️ CUSTOM_OBJECT</text>
    <text x="65" y="285" fill="#94a3b8" font-family="monospace" font-size="11">id: UUID (PK)</text>
    <text x="65" y="305" fill="#94a3b8" font-family="monospace" font-size="11">schema_ver: int</text>
    <text x="65" y="325" fill="#94a3b8" font-family="monospace" font-size="11">rel_id: FK ➔</text>
    <text x="65" y="345" fill="#94a3b8" font-family="monospace" font-size="11">attributes: JSONB</text>
  </g>

  <g class="card-float-2" opacity="0.6">
    <!-- Right Schema Node Card -->
    <rect x="980" y="50" width="170" height="130" rx="10" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.5" />
    <rect x="980" y="50" width="170" height="28" rx="10" fill="#9333ea" fill-opacity="0.25" />
    <text x="995" y="69" fill="#c084fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="bold" font-size="12">📊 DATA_PIPELINE</text>
    <text x="995" y="95" fill="#94a3b8" font-family="monospace" font-size="11">events: Stream</text>
    <text x="995" y="115" fill="#94a3b8" font-family="monospace" font-size="11">tables: M:N Map</text>
    <text x="995" y="135" fill="#94a3b8" font-family="monospace" font-size="11">sync_mode: Realtime</text>
    <text x="995" y="155" fill="#94a3b8" font-family="monospace" font-size="11">status: Active ✔</text>
  </g>

  <!-- Dynamic Animated Relational Connection Paths -->
  <path class="pulse-data-line" d="M 220 305 C 340 305, 360 210, 470 210" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5" />
  <path class="pulse-data-line" d="M 730 210 C 840 210, 860 115, 980 115" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.5" />
  
  <circle class="node-anim-1" cx="220" cy="305" r="5" fill="#38bdf8" />
  <circle class="node-anim-2" cx="600" cy="210" r="6" fill="#818cf8" />
  <circle class="node-anim-3" cx="980" cy="115" r="5" fill="#c084fc" />

  <!-- FOREGROUND: Main Title, Badge & Subtitle (Unobscured and Clean) -->
  <g id="foreground-content">
    <!-- Category Pill Badge -->
    <rect x="425" y="55" width="350" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
    <circle cx="445" cy="72" r="6" fill="#10b981" />
    <text x="462" y="77" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="600" font-size="13" letter-spacing="1.5">ENTERPRISE &amp; OPEN-SOURCE ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="600" y="160" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif" font-weight="900" font-size="44" fill="url(#primaryGrad)" letter-spacing="-0.5" filter="url(#subtleGlow)">
      Awesome Custom CRM Data Architecture
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="215" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="500" font-size="19" fill="#f1f5f9" letter-spacing="0.2">
      Flexible Schemas • Custom Objects • Low-Code Entities • Modern Relational Engines
    </text>

    <text x="600" y="250" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="400" font-size="15" fill="#94a3b8">
      Curated index of enterprise SaaS platforms and self-hosted open-source database architectures
    </text>

    <!-- Architectural Feature Pills (Anchored in Foreground) -->
    <g transform="translate(240, 295)">
      <rect x="0" y="0" width="160" height="36" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
      <text x="80" y="23" text-anchor="middle" fill="#7dd3fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="600" font-size="13">⚡ Custom Objects</text>

      <rect x="180" y="0" width="170" height="36" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6" />
      <text x="265" y="23" text-anchor="middle" fill="#a5b4fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="600" font-size="13">🔗 Relational Graphs</text>

      <rect x="370" y="0" width="170" height="36" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1" stroke-opacity="0.6" />
      <text x="455" y="23" text-anchor="middle" fill="#e9d5ff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="600" font-size="13">🛠️ Schema Extension</text>

      <rect x="560" y="0" width="160" height="36" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1" stroke-opacity="0.6" />
      <text x="640" y="23" text-anchor="middle" fill="#6ee7b7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="600" font-size="13">🚀 Self-Hosted / DB</text>
    </g>
  </g>
</svg>
